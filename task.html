<!DOCTYPE html>
<html>
<head>
    <title>Traffic Signal</title>

    <style>
        body {
            background-color:white;
        }

        .traffic-light {
            width: 150px;
            height: 450px;
            border: 3px solid black;
            margin: 50px auto;
            padding-top: 30px;
        }

        .light {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 30px auto;
        }

        .red {
            background-color: red;
        }

        .orange {
            background-color: orange;
        }

        .green {
            background-color: green;
        }
    </style>
</head>

<body>

    <div class="traffic-light">

        <div class="light red"></div>

        <div class="light orange"></div>

        <div class="light green"></div>

    </div>

</body>
</html>
