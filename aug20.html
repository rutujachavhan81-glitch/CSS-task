<!DOCTYPE html>
<html>
<head>
    <title>Div Homework</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #div4 {
            width: 900px;
            height: 700px;
            background-color: pink;
            border: 2px solid black;
            margin: 30px auto;

            /* ude for div center */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        #div1 {
            width: 300px;
            height: 120px;
            background-color: red;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #div2 {
            width: 300px;
            height: 120px;
            background-color: green;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #div3 {
            width: 300px;
            height: 120px;
            background-color: blue;

            display: flex;
            align-items: center;
            justify-content: center;
        }
        
    </style>
</head>

<body>
    
    <div id="div4">
        <h2>Div 4</h2>

        <div id="div1">Div 1</div>

        <div id="div2">Div 2</div>

        <div id="div3">Div 3</div>

    </div>

</body>
</html>
